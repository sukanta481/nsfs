<!DOCTYPE html>
<html>
<head>
    <title>Test Phone Autofill</title>
</head>
<body>
    <h2>Phone Autofill Test</h2>
    
    <label>Select Driver:</label>
    <select id="driver_select">
        <option value="">Choose Driver</option>
        <option value="1" data-phone="9876543210">Driver 1</option>
        <option value="2" data-phone="9876543211">Driver 2</option>
        <option value="3" data-phone="9876543212">Driver 3</option>
    </select>
    <br><br>
    
    <label>Driver Phone:</label>
    <input type="text" id="driver_phone" readonly>
    
    <script>
        console.log('Script loaded');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            
            const driverSelect = document.getElementById('driver_select');
            const driverPhoneInput = document.getElementById('driver_phone');
            
            console.log('Driver select:', driverSelect);
            console.log('Phone input:', driverPhoneInput);
            
            if (driverSelect && driverPhoneInput) {
                console.log('Both elements found, adding event listener');
                
                driverSelect.addEventListener('change', function() {
                    console.log('Change event fired');
                    const selectedOption = this.options[this.selectedIndex];
                    const phone = selectedOption.getAttribute('data-phone') || '';
                    console.log('Selected option:', selectedOption);
                    console.log('Phone from data-phone:', phone);
                    driverPhoneInput.value = phone;
                });
            }
        });
    </script>
</body>
</html>
